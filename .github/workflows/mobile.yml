name: Build GlobaleSIM Mobile APK + AAB

# The phone-plan app (tel.globalesim.mobile), in mobile/. Builds on pushes that touch mobile/,
# on the 'mobile' branch, on tags like mobile-v1.0.0, or by hand from the Actions tab.
on:
  push:
    branches: [main, mobile]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['mobile-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key (same key as the main GlobaleSIM app)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (see README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/globalesim.jks"
          echo "GS_KEYSTORE=$RUNNER_TEMP/globalesim.jks" >> "$GITHUB_ENV"

      - name: Newest Linphone 5.x
        run: |
          v=$(curl -fsSL https://download.linphone.org/maven_repository/org/linphone/no-video/linphone-sdk-android/maven-metadata.xml \
              | grep -oE '<version>5\.[0-9]+\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          echo "Linphone $v"; echo "LINPHONE_VER=${v:-5.4.+}" >> "$GITHUB_ENV"

      - name: Build release APK + Play bundle
        working-directory: mobile
        env:
          GS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GS_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'globalesim' }}
          GS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          export GS_VERSION_CODE=$((100 + RUN_NO))
          export GS_VERSION_NAME="0.1.$RUN_NO"
          gradle --no-daemon -PlinphoneVer="$LINPHONE_VER" :app:assembleRelease :app:bundleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/GlobaleSIM-Mobile-$GS_VERSION_NAME.apk
          cp app/build/outputs/bundle/release/*.aab ../out/GlobaleSIM-Mobile-play-$GS_VERSION_NAME.aab
          cp app/build/outputs/mapping/release/mapping.txt ../out/mapping-mobile-$GS_VERSION_NAME.txt 2>/dev/null || true
          echo "versionCode $GS_VERSION_CODE, versionName $GS_VERSION_NAME, Linphone $LINPHONE_VER" | tee ../out/version.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobaleSIM-Mobile-apk
          path: out/*

      # Latest build on the 'mobile-uploads' branch: the APK can be downloaded on a phone for testing,
      # and Play Console can take the .aab from there.
      - name: Publish to mobile-uploads branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          mkdir pu && cd pu
          git init -q && git checkout -q -b mobile-uploads
          cp ../out/* .
          git add -A
          git -c user.name="GlobaleSIM CI" -c user.email="ci@globalesim.tel" commit -qm "Mobile build $(cat version.txt)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mobile-uploads
